<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutoring Platform</title>
    <style>
        /* Modern, clean look - forget the default blue/gray */
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f4f7f6; color: #333; }
        header { background: #2c3e50; color: white; padding: 2rem; text-align: center; }
        .container { max-width: 800px; margin: 2rem auto; padding: 1rem; }
        .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 1rem; }
        .btn { background: #27ae60; color: white; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <h1>Tutoring Connect</h1>
    </header>
    <div class="container">
        <h2>Available Tutors</h2>
        <div class="card">
            <h3>Tutor Name</h3>
            <p>Subjects: Math, Science</p>
            <a href="#" class="btn">Book Session</a>
        </div>
    </div>
</body>
</html>
